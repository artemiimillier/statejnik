# statejnik.yaml - всё, что специфично для вашего проекта.
# Во время первой настройки заполняется как work/statejnik.draft.yaml
# (скрипты читают его через STATEJNIK_CONFIG) и только в конце настройки
# переносится в корень рабочей папки как statejnik.yaml.
# Настройка считается законченной, когда project.domain - ваш домен, а не example.com
# (проверка: python3 $SKILL_DIR/scripts/status.py). Комментарии на это не влияют.
# Ключи - только в .env.
# Пишите вложенные настройки блоками (как ниже), а не в фигурных скобках {a: 1}:
# встроенный разборщик без PyYAML понимает только блоки и списки [a, b].

project:
  name: "Название бизнеса"
  domain: "example.com"          # ваш домен без https://, например shop.ru - главный признак конца настройки
  content_path: "/blog"          # раздел статей на сайте; site.py scan берёт его в приоритет
  region: "Россия"
  brands: []                     # ваш бренд и бренды конкурентов (запросы с ними не берём в статьи)

audience:
  profile: |
    Кто читатель, что он знает и чего не знает, чего боится, что хочет получить.
  jargon_level: "low"            # low - термины объясняем; high - читатель эксперт

voice:
  person: "мы"                   # от чьего лица: я / мы
  address: "вы"                  # обращение к читателю: ты / вы
  source: ""                     # папка с образцами текстов владельца (необязательно)
  forbidden: []                  # фразы, которые звучат не по-вашему

cta:
  offer: "Что продаём статьями"
  url: "https://example.com/offer"

# Эти настройки выполняет агент по process/semantic-visuals.md, не image API скрипта.
visuals:
  mode: unconfigured             # enabled | text_only, согласовать до первой статьи
  text_only_approval: ""          # явное согласие владельца и причина, если text_only
  generator: ""                  # реально доступный разрешённый инструмент
  processor: ""                  # оптимизация и проверка/очистка метаданных
  reviewer: ""                   # доступный инструмент зрения или просмотр владельцем
  delivery: ""                   # files bundle или проверенная загрузка + HTTPS URLs
  budget: ""                     # лимит на статью/день с валютой; 0 если без расходов
  max_attempts: 2                 # согласовать; смена slug не обнуляет бюджет

materials:
  video_sources: []               # необязательные разрешённые источники владельца
  cta_sources: []                 # реальные готовые материалы, не обещанные подарки

editorial:
  banned_words: []               # стоп-слова: бренд-табу, юр-ограничения
  notes: ""                      # особые правила ниши (медицина, финансы и т. п.)

seo:
  seeds: []                      # стартовые фразы (можно вместо work/seeds.txt)
  regions: [225]                 # регионы Вордстата: 225 Россия, 213 Москва, 2 СПб
  competitors: []                # домены конкурентов

publish:
  auto: false                    # true - агент публикует сам; false - только черновики
  default: site                  # площадка по умолчанию
  targets:
    files:
      type: manual               # готовые .md и .html в папку; тип files - то же самое
      dir: work/ready
    # site:
    #   type: wordpress
    #   url: https://example.com
    # dzen:
    #   type: dzen_rss
    #   feed_path: /var/www/example.com/dzen.xml
    #   feed_url: https://example.com/dzen.xml
    #   default_image: https://example.com/cover.jpg
    # blogspot:
    #   type: blogger
    #   blog_id: "1234567890"
    # notion:
    #   type: mcp
    #   server: notion
    #   tool: create-page

report:
  channel: chat                  # chat - ответ в чате агента + копия work/<slug>/report.md;
                                 # file - только work/<slug>/report.md

tools:                           # пороги проверок; можно не трогать
  originality:
    max_cosine: 0.5
    max_ngram: 0.3
    ngram_n: 5
  read_aloud:
    max_sentence_words: 28
    max_word_len: 17
    max_consonant_run: 5
  cadence:
    max_per_1k: 8.0
  structure:
    min_internal_links: 3        # ориентир; меньше подходящих статей - меньше, с причиной
